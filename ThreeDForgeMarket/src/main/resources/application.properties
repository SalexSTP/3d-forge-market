spring.application.name=3DForgeMarket

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/threed_forge_market_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MVC configuration
spring.mvc.hiddenmethod.filter.enabled=true

# Custom print microservice
custom-print-service.base-url=${CUSTOM_PRINT_SERVICE_BASE_URL:http://localhost:8081}

# Payment configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}
payment.currency=eur
stripe.enabled=${STRIPE_ENABLED:false}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.checkout-display-name=${STRIPE_CHECKOUT_DISPLAY_NAME:3DForgeMarket}

# Development settings
spring.thymeleaf.cache=false
logging.level.org.hibernate.persister.entity=ERROR
