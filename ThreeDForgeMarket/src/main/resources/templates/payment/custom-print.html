<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose payment | 3DForgeMarket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow-page">
    <section class="page-heading with-action">
        <div>
            <p class="eyebrow">Custom print offer</p>
            <h1>Choose payment</h1>
        </div>
        <a class="btn btn-ghost" th:href="@{/custom-prints/{id}(id=${request.id})}">Back to request</a>
    </section>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <form class="form-card"
          th:action="@{/payments/custom-prints/{id}(id=${request.id})}"
          th:object="${paymentForm}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="card-topline">
            <h2 th:text="${request.title}">Custom print request</h2>
            <span class="status-badge status-offer_sent">Offer sent</span>
        </div>

        <dl class="details-specs">
            <div>
                <dt>Quoted price</dt>
                <dd th:text="|EUR ${#numbers.formatDecimal(request.quotedPrice, 1, 2)}|">EUR 42.00</dd>
            </div>
            <div>
                <dt>Currency</dt>
                <dd>EUR</dd>
            </div>
        </dl>

        <fieldset class="payment-method-group">
            <legend>Payment method</legend>

            <label class="payment-option"
                   th:each="method : ${paymentMethods}">
                <input type="radio"
                       th:field="*{paymentMethod}"
                       th:value="${method}"
                       th:disabled="${method.name() == 'STRIPE_CHECKOUT' and !stripeAvailable}">
                <span th:text="${method.displayName}">Cash on delivery</span>
                <small th:if="${method.name() == 'STRIPE_CHECKOUT' and !stripeAvailable}">
                    Online payments are currently unavailable.
                </small>
            </label>

            <p class="field-error"
               th:if="${#fields.hasErrors('paymentMethod')}"
               th:errors="*{paymentMethod}">
                Payment method error.
            </p>
        </fieldset>

        <div class="action-row">
            <button class="btn btn-primary" type="submit">Continue</button>
            <a class="btn btn-ghost" th:href="@{/custom-prints/{id}(id=${request.id})}">Cancel</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
